name: Release VSIX

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0, v0.0.1 的 Tag 时自动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 赋予创建 Release 和上传文件的权限

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Node.js 环境（升级到 Node 20 或更新版本）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装项目依赖并执行编译
      - name: Install dependencies and compile
        run: |
          npm ci
          npm run compile   # 确保执行 package.json 中的编译脚本，生成 out/ 目录

      # 4. 使用官方 vsce 工具打包生成 .vsix 文件
      - name: Package VSIX extension
        run: |
          npx @vscode/vsce package --out vscode-log-searcher.vsix

      # 5. 自动创建 GitHub Release 并上传 .vsix 附件
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-log-searcher.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}