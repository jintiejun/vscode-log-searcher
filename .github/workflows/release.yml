name: Release VSIX

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0, v0.0.1 的 Tag 时自动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装项目依赖并编译
      - name: Install dependencies and compile
        run: |
          npm ci
          # 如果你的 package.json 中定义了编译脚本（如用 esbuild 打包），确保这里会执行
          # npm run compile

      # 4. 使用官方 vsce 工具打包生成 .vsix 文件
      - name: Package VSIX extension
        run: |
          npx @vscode/vsce package --out vscode-log-searcher.vsix

      # 5. 自动创建 GitHub Release 并上传 .vsix 附件
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-log-searcher.vsix
          generate_release_notes: true # 自动根据 commit 生成 Release 变更日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}